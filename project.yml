name: JTV
options:
  bundleIdPrefix: com.luun.nguyen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Swift 6 language mode for the whole project (the JTV
    # target also pins it explicitly). Base previously said
    # 5.9 with dead 1.1/2 version stamps — a trap: dropping
    # the target override would have silently reverted the
    # app to Swift 5 mode (review-gate hygiene fix).
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.22.23"
    CURRENT_PROJECT_VERSION: "49"
    DEVELOPMENT_TEAM: ""
packages:
  # v1.21: KSPlayer (FFmpeg engine) for the Torrent tab's debrid
  # files only — AVPlayer has no Matroska demuxer, and debrid
  # downloads are predominantly MKV. Pinned exactly, the same
  # version the Joe TV tvOS build runs.
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: "2.3.4"
targets:
  JTV:
    type: application
    platform: iOS
    sources:
      - JTV/JTVApp.swift
      - JTV/ContentView.swift
      - JTV/Models.swift
      - JTV/PluginEngine.swift
      - JTV/PluginManager.swift
      - JTV/MovieService.swift
      - JTV/MetadataOverlay.swift
      - JTV/DiagLog.swift
      - JTV/AudioSession.swift
      - JTV/Library.swift
      - JTV/Cache.swift
      - JTV/AutoSub.swift
      - JTV/AutoSubSubtitles.swift
      - JTV/AutoSubTranslator.swift
      - JTV/AutoSubCache.swift
      - JTV/AutoSubOverlay.swift
      - JTV/Theme.swift
      - JTV/HomeView.swift
      - JTV/CategoryView.swift
      - JTV/SearchView.swift
      - JTV/DetailView.swift
      # Phase 2 (1.22.17): the actor filmography screen (L-T26).
      - JTV/ActorView.swift
      - JTV/PlayerView.swift
      - JTV/HLSProxy.swift
      - JTV/LocalHLSServer.swift
      - JTV/MangaReaderView.swift
      - JTV/LibraryView.swift
      - JTV/SettingsView.swift
      - JTV/DebridSecrets.swift
      - JTV/DebridResolver.swift
      - JTV/KSPlayerView.swift
      - JTV/TorrentTabView.swift
      - JTV/Plugins
      - JTV/Assets.xcassets
    dependencies:
      - package: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.jtv
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Swift 6 language mode (owner order 2026-11-18).
        SWIFT_VERSION: "6.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "JTV"
        CFBundleName: "JTV"
        CFBundleShortVersionString: "1.22.23"
        CFBundleVersion: "49"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
