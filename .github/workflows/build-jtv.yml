name: Build JTV IPA

# Manual dispatch ONLY (budget rule — never build on push).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project JTV.xcodeproj \
            -scheme JTV \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Packaging $APP_PATH"
          rm -rf Payload JTV.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r JTV.ipa Payload > /dev/null
          ls -lh JTV.ipa

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=JTV-ipa-run${{ github.run_number }}-$(date +%F)" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: JTV.ipa
